southern_flounder:
  weights:
    flow: 0.9           # ambush predator: wants moving water, not fast water
    stage: 1.0          # the strongest stage bias of the three
    light: 0.5
    solunar: 0.3
    pressure: 0.5
    wind: 0.6
    water_temp: 1.0     # falling through the low 60s triggers the run
    salinity: 0.6
    season: 1.0
  structure_weight: 0.2
  light_cloud_widen: 0.35
  curves:
    flow:
      x: [0.0, 0.08, 0.20, 0.45, 0.80, 1.50]
      y: [0.15, 0.60, 1.00, 0.80, 0.45, 0.15]
    stage:              # spec section 8: "flounder bias to ebb" -- peaks on the falling half
      # x runs a full tidal cycle, so x=0.0 and x=1.0 are the same physical
      # instant (low water) and y must match at both ends -- 0.50, closed,
      # not the 0.60 an earlier draft left at the wrap (2026-08-26 review).
      x: [0.00, 0.30, 0.55, 0.75, 0.90, 1.00]
      y: [0.50, 0.60, 0.85, 1.00, 0.90, 0.50]
    light:
