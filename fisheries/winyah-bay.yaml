slug: winyah-bay
name: Winyah Bay
timezone: America/New_York
bbox: [-79.45, 33.15, -79.05, 33.60]
center: [-79.25, 33.35]
orientation_deg: 135 # entrance faces southeast
stations:
  # South Island Ferry, Intracoastal Waterway (33.2517, -79.2683) -- in-bay,
  # preferred by name per NOAA CO-OPS mdapi tidepredictions live lookup.
  tide: ["8662549"]
  # Winyah Bay entrance (33.2072, -79.1845) -- nearest the jetties/bay mouth,
  # per NOAA CO-OPS mdapi currentpredictions live lookup.
  currents: ["ACT6531"]
  # Resolved 2026-08-13 from the station's own datums endpoint (station
  # 8662549 does publish NAVD88):
  #   curl -s https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8662549/datums.json
  #   MLLW 2.560 ft, NAVD88 4.730 ft (both station datum, feet)
  #   offset = (MLLW - NAVD88) * 0.3048 = (2.560 - 4.730) * 0.3048 = -0.661 m
  # Add this to CO-OPS MLLW predictions (ft*0.3048) to get NAVD88 metres, the
  # bathymetry datum.
  tide_datum_offset_m: -0.661
  # Springmaid Pier, Myrtle Beach (33.6550, -78.9183) -- ~42.8 km NE on the
  # open coast, the CLOSEST CO-OPS station tagged with a "Physical
  # Oceanography" product page (Charleston, 8665530, 92.5 km away, carries
  # the same tag and is also within 100 km -- corrected 2026-08-22; "sole"
  # was inaccurate). It measures shelf water, which is the role it plays:
  # the ocean end-member the intrusion profile decays away from, not an
  # in-bay observation.
  # NOT AVAILABLE, probed 2026-08-16 -- do not re-litigate without new access:
  #   - NERR North Inlet-Winyah Bay (Oyster Landing et al) live polling: the
  #     CDMO SOAP web service returns "Invalid ip" for every method; it
  #     requires IP registration via a form a human must submit. This does
  #     NOT apply to CDMO's separate query interface / "zip downloads"
  #     feature, which a human uses through a browser -- see Phase 2 Task 9
  #     (sources/cdmo.py) for the historical importer that reads what that
  #     feature exports.
  #   - Mid-bay USGS salinity: none exists. The only in-bbox 00480 sites are
  #     the two Waccamaw stations above, both ~30 km up-river reading 0-1 ppth.
  # STATION DOES NOT ACTUALLY SERVE SALINITY, live-probed 2026-08-22:
  #   curl -s "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=salinity&station=8661070&date=latest&datum=MLLW&units=metric&time_zone=gmt&format=json&application=tidescout"
  #   -> {"error": {"message": "No data was found..."}}, same for 2026-08-16,
  #   a recent 2-day window, and 2015-01-01..07 (no historical data either).
  #   Its sensors.json has no Conductivity/Salinity sensor -- only Wind, Air
  #   Temperature, Water Temperature, Barometric Pressure, Tsunami WL,
  #   Microwave WL. "Physical Oceanography" is a broad tag (239 CO-OPS
  #   stations nationwide carry it) and does not imply salinity reporting.
  #   The other 4 CO-OPS stations within 250 km (Charleston 8665530,
  #   Wilmington 8658120, Wrightsville Beach 8658163, Fort Pulaski 8670870)
  #   were also checked and none carry a Conductivity sensor either -- there
  #   is no live CO-OPS salinity substitute near Winyah Bay today. Kept
  #   configured anyway: it is the documented best candidate. That
  #   {"error": ...} response makes fetch_ocean_salinity RAISE
  #   SourceUnavailable (a real failure, not "responded with nothing
  #   usable") -- it is meant to propagate to sources.dayloader.load_day's
  #   attempt(), which records failing sources by name in `missing`, rather
  #   than silently falling back to SalinityConfig.ocean_ppt with no trace.
  ocean_salinity: "8661070"
  water:
    # WACCAMAW RIVER NEAR PAWLEYS ISLAND, SC (33.5066, -79.1270) -- tidal
    # reach (site_tp_cd=ST-TS), live-reporting both params (temp 27.5-30.9
    # degC, salinity 0.0 ppth over the last 3 days).
    - kind: usgs
      station: "021108125"
      params: ["00010", "00480"]
    # WACCAMAW R NR HAGLEY LANDING NR PAWLEYS ISLAND, SC (33.4446, -79.1739)
    # -- tidal reach, live-reporting both params (temp 28.9-29.8 degC,
    # salinity 0.0-1.0 ppth).
    - kind: usgs
      station: "02110815"
      params: ["00010", "00480"]
    # SAMPIT RIVER BELOW US 17 NEAR GEORGETOWN, SC (33.3599, -79.2880) --
    # right at Georgetown; only 00010 (temp) reports live, no 00480 data
    # available for this site, so salinity omitted.
    - kind: usgs
      station: "02136371"
      params: ["00010"]
    # ---- NERRS North Inlet-Winyah Bay reserve, six water-quality stations ----
    # All six are STORED (data/winyah-bay/ndbc.sqlite, 2.05 M salinity
    # readings over 2016-01-01..2026-08-23) and all six are covered by the
    # NERRS citation. `off_axis` decides only whether the salt-intrusion fit
    # may read them.
    #
    # WYSS1 is the one with an NDBC mirror, so it alone is polled live
    # (sources/ndbc.py, 15-minute cadence, hundredths of a psu). NDBC's
    # realtime2 feed is a rolling window -- measured 45.6 days / 4,235 rows
    # on 2026-08-23 -- so the store accumulates every fetch rather than
    # re-reading only what NDBC currently serves. Its `params` are that
    # product's own `.ocean` column headers, not USGS/CO-OPS codes.
    #
    # The other five have no mirror: their history is a manual one-shot
    # backfill via `tidescout salinity import-cdmo`. They are declared
    # anyway because the calibration path reads this list to decide what to
    # look for in the store.
    #
    # DISTANCES RE-MEASURED 2026-08-23 against the corrected distance field
    # (see model_domain.salt_source_boundary_utm_km -- the old figures were
    # measured along a route that exited through North Inlet, understating
    # the bay by 27-43%). Format: along-estuary km, snap gap m.
    #
    # WINYAH BAY PROPER -- on the salt-intrusion axis, fitted:
    - kind: cdmo                       # Thousand Acre    16.68 km, snap 12.1 m
      station: "NIWTAWQ"               # mean salinity  7.12 ppt
      params: ["SAL"]
      off_axis: false
    - kind: ndbc                       # Winyah Bay SURFACE 19.03 km, snap 5.0 m
      station: "WYSS1"                 # mean salinity  5.96 ppt
      params: ["DEPTH", "OTMP", "COND", "SAL", "O2%", "O2PPM", "CLCON", "TURB", "PH", "EH"]
      off_axis: false
    - kind: cdmo                       # Winyah Bay BOTTOM  19.03 km, snap 3.2 m
      station: "NIWWBWQ"               # mean salinity  9.60 ppt
      params: ["SAL"]
      off_axis: false
    # The WS/WB pair share one piling and one along-estuary distance, and
    # differ only in depth. Bottom is saltier than surface by a median
    # +3.30 ppt (Task 11, 337,891 paired instants; bottom saltier 86.8% of
    # the time). A depth-averaged single-layer model cannot be both, and that
    # is a real part of why it does not fit -- dropping to surface-only alone
    # takes the fit rmse from 4.07 to 3.37 ppt.
    #
    # NORTH INLET -- a SEPARATE BRANCH, stored but NOT fitted:
    # These three average 31.4-32.0 ppt where the bay's own three average
    # 6.0-9.6, at distances that order them the wrong way round (12.88-14.18
    # vs 16.68-19.03 km). They are NOT hydrologically isolated -- all six
    # respond to discharge, r(S, logQ) = -0.66 to -0.79, 9.4-15.9 ppt from
    # low to high flow -- North Inlet simply takes the Winyah plume on the
    # flood while being flushed by its own ocean inlet. A single distance
    # axis cannot carry a 25 ppt baseline offset between two branches, so
    # including them would clear n_distinct_distances>=3 only by counting two
    # branches as one profile.
    # Their distances also MOVE with the seed polygon's northern cut, while
    # the bay's do not -- they route to the seed's EDGE rather than to a
    # mouth, which is further evidence they are off this axis.
    - kind: cdmo                       # Clambank Landing 12.88 km, snap  4.3 m
      station: "NIWCBWQ"               # mean salinity 31.91 ppt
      params: ["SAL"]
      off_axis: true
    - kind: cdmo                       # Oyster Landing  13.76 km, snap  5.6 m
      station: "NIWOLWQ"               # mean salinity 32.04 ppt
      params: ["SAL"]
      off_axis: true
    - kind: cdmo                       # Debidue Creek   14.18 km, snap  8.0 m
      station: "NIWDCWQ"               # mean salinity 31.38 ppt
      params: ["SAL"]
      off_axis: true
    # The reserve runs exactly ONE weather station system-wide, at Oyster
    # Landing (niwolmet). It is not a water sensor and is not declared here;
    # `import-cdmo` routes MET files into the sibling met_observations table
    # by their own header. Weather feeds the bite score in Phase 3's design,
    # but nothing reads that table yet.
rivers:
  # WARNING (root cause of the 2026-08-14 library build failure -- 6 of 9
  # regimes died with "Too small timestep"): inflow_lonlat must sit well
  # inside the domain, in the channel, in water deeper than -2 m -- NEVER on
  # or near the model_domain.polygon_utm_km boundary. The Pee Dee point below
  # was literally on polygon vertex v8 (0.4 m from the reflective `wall`
  # boundary); injecting 42.8 m3/s there against a reflective wall had
  # nowhere for the energy to go and produced a 3-7 m/s cell cluster ~1,700 m
  # upstream against a domain median of 0.045 m/s. Black River's point, 2,050
  # m inside the domain, showed no anomaly and is the control case. Always
  # re-verify against the real mesh (wet-cell count inside the 150 m
  # Inlet_operator injection box) after any domain-polygon or mesh change.
  # PEE DEE RIVER AT PEEDEE, SC (34.2043, -79.5484). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 3830-6710 cfs.
  # (More-downstream "PEE DEE RIVER AT HWY 701 NR BUCKSPORT, SC" 02135200 is
  # classified site_tp_cd=ST but empirically tidal -- 7 negative/reversing
  # readings in the same window -- so excluded despite being closer to the
  # bay.)
  - name: Pee Dee
    usgs_site: "02131000"
    weight: 1.0
    # inflow_share added 2026-08-16. Derived from the same 365-day per-gauge
    # daily means that calibrated discharge_buckets: Pee Dee 3745, Waccamaw
    # 642, Black 397 cfs, total 4784 -> 0.783 / 0.134 / 0.083. Before this,
    # `weight: 1.0` on all three made river_inflow_m3s split the composite
    # into equal thirds, injecting 4x the Black's share and 42% of the Pee
    # Dee's. `weight` is deliberately left at 1.0: it means something else
    # (include this gauge in the composite sum) and is correct as it stands.
    inflow_share: 0.783
    # Moved 2476 m 2026-08-14. Was on domain polygon vertex v8 (0.4 m from the
    # reflective wall), which caused the corner-injection instability that
    # killed 6 of 9 regimes. Now 2422 m from the domain polygon vertex, bed
    # -2.22 m, 961 wet 10 m raster cells inside the 150 m inlet box.
    # CORRECTED 2026-08-14: distance to the actual mesh ring (the reflective
    # wall Inlet_operator's 150 m box sits against) is 730 m, not 2422 m --
    # that figure was distance to the authored domain polygon, a different
    # line. The wet-cell count Inlet_operator actually sees is the mesh
    # centroid count, not the raster-cell count: 86/86 centroids wet in the
    # inlet box (raster cells were a proxy, not what the solver samples).
    # This point is now 2.5 km from Waccamaw's (was 5.0 km) -- not yet
    # confirmed the two sit in separate channels rather than both below the
    # Black/Pee Dee confluence; if they don't, per-river weighting here is
    # decorative regardless of the weight field above.
    inflow_lonlat: [-79.22587, 33.40619]
  # WACCAMAW RIVER NEAR LONGS, SC (33.9127, -78.7150). Confirmed non-tidal
  # via live 3-day IV discharge history: 0 negative readings, 29-56 cfs.
  # Originally found by widening the live USGS site search manually, because
  # discovery.py's USGS bbox padding was asymmetric (east pad only +0.1 deg)
  # and missed this site -- the Waccamaw bends NE past Conway toward Longs on
  # the NC line. That padding is now symmetric (+/-1.0 deg on all four
  # sides), so a plain `tidescout stations winyah-bay` re-run reproduces this
  # ID directly; live-reconfirmed in the table after the fix. The only other
  # in-bbox Waccamaw discharge site (Hagley Landing, 02110815) is tidal
  # (site_tp_cd=ST-TS) and has no live 00060 IV data, so it was rejected for
  # this role (it is instead recorded as a water sensor above).
  - name: Waccamaw
    usgs_site: "02110500"
    weight: 1.0
    inflow_share: 0.134
    # Moved 2469 m 2026-08-14; was 35 m from the reflective wall. Now 1246 m
    # from the authored domain polygon, bed -2.10 m, 626 wet 10 m raster
    # cells in the inlet box.
    # CORRECTED 2026-08-14: distance to the actual mesh ring is 89 m, not
    # 1246 m -- 1246 m was distance to the domain polygon, a different line
    # from the mesh boundary the reflective wall physics actually sits on.
    # The wet-cell count Inlet_operator actually sees is the mesh centroid
    # count: 72 centroids in the inlet box, 58 of them wet (not 626 raster
    # cells, which is a coarser proxy). See the Pee Dee comment above for the
    # same correction and the outstanding 2.5 km separate-channel question.
    inflow_lonlat: [-79.20462, 33.42022]
  # BLACK RIVER AT KINGSTREE, SC (33.6623, -79.8361). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 35-46 cfs. The
  # more-downstream alternative "BLACK RIVER NEAR ANDREWS, SC" 02136030 is
  # also site_tp_cd=ST but returned no live 00060 IV data in the same query,
  # so it was rejected as unreliable for real-time use.
  - name: Black
    usgs_site: "02136000"
    weight: 1.0
    inflow_share: 0.083
    # Vertex 9 (658.0, 3696.0) -- "NW, west of Georgetown", the westernmost
    # of the three -- matches the Black River joining the Pee Dee well
    # upstream (near Kingstree) from the west/inland side before the
    # combined flow reaches the bay.
    # CORRECTED 2026-08-14: the literal vertex sits on dry marsh -- the
    # nearest wet mesh centroid was 2,706 m away, so Inlet_operator's 150 m
    # injection box found zero centroids at all and crashed
    # (AttributeError: 'Inlet' object has no attribute 'inlet_line').
    # Moved to the nearest well-covered point on the same west-side channel,
    # utm=(661500, 3695870), 3,502 m from the original vertex and ~4,837 m
    # from the Pee Dee injection point (no overlap): 90/90 mesh centroids in
    # the 150 m box are wet (re-measured 2026-08-14, up from an earlier
    # 79-centroid count on a since-changed mesh), better coverage than Pee
    # Dee's own point (86/86 wet). A cluster further south near Georgetown's
    # harbor had even denser coverage but was rejected -- it is the Sampit's
    # waterway, not a plausible proxy for the Black/Pee Dee confluence this
    # vertex represents.
    inflow_lonlat: [-79.26360, 33.38999]
discharge_buckets:
  # Recalibrated 2026-08-13 from 365 days of USGS daily means (statCd 00003),
  # weighted composite of the three gauges below (all weight 1.0). n=365 days:
  # min 1232 / p25 2774 / median 3866 / p75 6292 / max 22996 cfs.
  # Per-gauge means: Pee Dee 3745 (02131000, 365d), Waccamaw 642 (02110500,
  # 365d), Black 397 (02136000, 363d) cfs -- the composite is ~78% Pee Dee,
  # which is why the old 6000/25000 pair (authored before the gauges were
  # chosen) put nearly every day in "low" (p75 of 6292 barely clears the old
  # low threshold, and 25000 is above the observed max).
  low_below_cfs: 2774
  high_above_cfs: 6292
  # NOT a bucket edge -- the flow the `freshet` regime is simulated AT, and the
  # observed maximum of the same 365-day composite record as the two edges
  # above (min 1232 / p25 2774 / median 3866 / p75 6292 / max 22996 cfs).
  #
  # Added 2026-08-23 (Plan 4 Task 7). Before it, the simulated axis stopped at
  # the p75 while real freshets run 3.65x past it, so `blend_regimes` clamped
  # every flow above 6292 cfs onto the `high` regime. MEASURED, not assumed:
  # a full mean_high run at 22996 cfs differenced against production mean_high
  # over 26 phases and 5.48M wet-centroid samples moves the velocity field by
  # 17.20% of per-phase p99 speed -- 22x the 0.77% floor of the
  # southern-approach variant, a change known to be negligible -- and by 0.054
  # m/s at Georgetown against flows of ~1 m/s. Reproduce with
  # `backend/tools/compare_variant.py`.
  #
  # This does NOT contradict Plan 3's finding that the discharge axis barely
  # moves speed. That was measured across 2774 -> 6292 cfs, a 2.3x span
  # entirely inside the p25-p75 band. The axis was never weak; it was too
  # short to show its own effect. RANGE_STEP_COST/DISCHARGE_STEP_COST stay as
  # they are -- see engine/flow.py for what the fourth bucket does to their
  # tie-breaking, which is now a tie rather than a win.
  freshet_cfs: 22996
salinity:
  # ============================================================================
  # CALIBRATION RE-RUN 2026-08-23 ON THE FULL NERRS RECORD -- THE MODEL IS
  # FALSIFIED, NOT MERELY UNCONSTRAINED. Values below remain THEORETICAL.
  #
  # Task 5 (below) could only say "these data cannot tell." With 2.05 M NERRS
  # readings over 10.6 years the answer is no longer "cannot tell":
  #
  #   10,864 observations + 10,864 tidal swings, 2016-01-01 .. 2026-08-22,
  #   discharge 1,232-183,660 cfs, 3,569 distinct flows.
  #     rmse            4.060 ppt  against an observation resolution of 0.003
  #                                -- 1,353x. Task 5's 1.719 ppt was 1.7x its
  #                                1.0 ppt USGS quantum, which is why it could
  #                                only report ignorance. NERRS resolves to
  #                                hundredths, so the same test now reads three
  #                                orders of magnitude over resolution.
  #     tidal-swing rmse 5.073 ppt against a resolution of 0.044 -- 115x.
  #     condition 12.2, every 1-sigma well below its value, nothing at a
  #     bound. The fit is NUMERICALLY healthy and still reproduces nothing:
  #     exactly the failure mode the warnings block was written to catch.
  #   fitted=False. Nothing from that run is written below.
  #
  # THREE MEASURED REASONS, none of which more data of this kind would fix:
  #   1. STRATIFICATION. The WS/WB pair share one distance and differ by a
  #      median +3.30 ppt (bottom saltier 86.8% of 337,891 paired instants).
  #      A depth-averaged single layer cannot be both; dropping to surface-only
  #      alone moves rmse 4.07 -> 3.37.
  #   2. TWO BRANCHES ON ONE AXIS. North Inlet reads 31.4-32.0 ppt where the
  #      bay reads 6.0-9.6 at distances that order them the wrong way round.
  #      Excluded as off_axis (see stations.water); including them would clear
  #      n_distinct_distances>=3 only by calling two branches one profile.
  #   3. COVERAGE, and this is the binding one. The bay's own stations sit at
  #      16.68 and 19.03 km -- TWO distinct distances spanning 2.35 km --
  #      against a fitted front width of 14.48 km. Every known fishing spot
  #      sits at 2.58-13.05 km, i.e. entirely BELOW the observed range. The
  #      CDMO import did not close Task 5's extrapolation gap; it moved the
  #      observations further from the spots, not closer.
  #
  # WHAT WOULD ACTUALLY RESOLVE IT, superseding Task 5's note below: NOT more
  # NERRS history, and NOT the CDMO IP registration (that data is now in hand
  # and is what produced this result). Either a salinity sensor between the
  # jetties and Mud Bay Cut -- the 2.58-13.05 km reach where the spots are and
  # no observation exists -- or a model with an axis for the vertical
  # structure and the branching, which is a design change, not a fit.
  #
  # The climatology fallback below therefore stays live and load-bearing.
  # ============================================================================
  #
  # CALIBRATION ATTEMPTED AND DECLINED 2026-08-22 (Task 5). Every value below
  # is still THEORETICAL, not fitted. `tidescout salinity calibrate` runs and
  # returns numbers; those numbers are not constrained by any data that
  # exists, so writing them here would have made the block look calibrated
  # while being no better anchored than it is now. What the run found:
  #
  #   - Winyah Bay has exactly two USGS 00480 sites (021108125, 02110815).
  #     BOTH lie outside the model domain -- 9,498 m and 1,362 m from the
  #     nearest in-domain library cell -- so both snap to the SAME cell, the
  #     distance field's maximum at 31.57 km. Every observation that exists
  #     carries one along-estuary distance, at the extreme fresh end.
  #   - The 0-31.57 km reach the scoring layer actually reads has no salinity
  #     observation at all. The only in-domain candidate, SAMPIT RIVER
  #     02136371 at 20.01 km, returns zero 00480 records over four years
  #     (live-probed 2026-08-22, 1,500-day dv query: 0 timeSeries entries).
  #   - No ocean end-member: no CO-OPS station within 250 km serves salinity
  #     (Task 4). ocean_ppt was HELD at 34.0, not fitted.
  #   - q0_cfs is held because it is EXACTLY degenerate with l0_km:
  #     L = l0*(Q/q0)^-k is invariant under (l0, q0) -> (l0*c^k, c*q0).
  #
  #   Fit over 348 daily means (365 d, 02110815 admitted at --max-snap-m 2000),
  #   composite discharge 1,232-11,905 cfs, plus 117 observed tidal swings:
  #     l0_km 4.105  k 1.040  front_width_km 16.623  excursion_km 11.525
  #     rmse_ppt 1.719   swing_rmse_ppt 2.993
  #     n_obs 348   n_interior_obs 36   n_distinct_distances 1
  #     cfs_span (1231.6, 11905.0)   condition_number 44.8   at_bounds []
  #     warning: DISTANCE COVERAGE TOO THIN -- 1 distinct along-estuary
  #     distance spanning 0.00 km against a fitted front width of 16.62 km.
  #
  #   WHY THOSE NUMBERS WERE NOT WRITTEN IN. Holding front_width_km at 5, 8,
  #   12 and 16 km and refitting the rest gives four fits whose rmse spans
  #   1.6978-1.7137 ppt -- a spread of 0.016 ppt, 60x below the 1 ppt
  #   quantisation of the observations themselves (all 348 daily means are
  #   whole numbers; 56% are exactly 0.0). Those four indistinguishable fits
  #   predict, at median flow: North Jetty 19.8-34.0 ppt, Mud Bay Cut
  #   12.6-33.9 ppt, mid-bay 4.7-27.1 ppt, with l0_km spanning 5.1-23.4 km.
  #   The data cannot tell a nearly-oceanic Mud Bay Cut from a brackish one.
  #   Note that every NUMERICAL health check passes on this fit (condition
  #   44.8, all 1-sigma below their values, nothing on a bound) -- they
  #   describe the design that was observed and cannot see the extrapolation.
  #
  #   NO FALLBACK EXISTS FOR THE SPATIAL FIELD. Corrected 2026-08-22 after an
  #   earlier draft of this note claimed a climatology fallback covers this;
  #   it does not. The only live climatology substitution is in
  #   sources/usgs.py's water_summary, which fills a single bay-wide SCALAR
  #   (climatology.salinity_ppt_by_month) for the conditions summary. Nothing
  #   substitutes for the per-cell field: engine.salinity.salinity_field
  #   computes from these constants unconditionally, so while `fitted` is
  #   false the field must NOT be read as a between-spot discriminator. It
  #   still varies correctly WITH discharge and tide at a given spot (Mud Bay
  #   Cut moves 14.8 ppt across the discharge range and swings 11.3 ppt
  #   tidally); what collapsed is the near-mouth BETWEEN-SPOT gradient.
  #
  #   WHAT WOULD RESOLVE IT: one salinity sensor anywhere between the mouth
  #   and Georgetown. Registering the NERR CDMO IP (North Inlet-Winyah Bay,
  #   Oyster Landing) would supply exactly this; the CDMO web service returns
  #   "Invalid ip" until a human submits their form. Until then these
  #   constants stay theoretical.
  #
  # DERIVED FROM MEASUREMENT 2026-08-25 (was 34.0, an unsourced regional
  # convention -- "typical nearshore Atlantic salinity runs ~34-36 ppt" -- with
  # no station behind it). This value now comes from data.
  #
  # HOW: the seaward end-member is what the sea reads when it is least diluted,
  # so North Inlet's three NERRS stations were conditioned on genuinely marine
  # conditions -- composite river discharge at or below its 10th percentile
  # (3,263 cfs) AND tidal phase in [0.40, 0.60], i.e. near high water. North
  # Inlet is flushed by its OWN ocean inlet rather than by the Pee Dee, which
  # is exactly what makes it a cleaner shelf proxy than any on-axis station
  # (see stations.water's off_axis note -- being off the profile's axis is a
  # qualification here, not a disqualification).
  #
  # MEASURED: 18,454 readings over 389 distinct days. The three stations agree
  # to within 0.25 ppt, which is the strongest evidence this is a real signal
  # and not one sonde's drift:
  #     NIWCBWQ  n=6,628  mean 35.37 ppt
  #     NIWOLWQ  n=7,406  mean 35.59
  #     NIWDCWQ  n=4,420  mean 35.34
  # Mean of DAILY means 35.47, sd 0.90 (daily means, not pooled readings, so a
  # day with more samples does not count extra). Rounded to 35.5: the standard
  # error is ~0.20 ppt, so one decimal is all the data supports.
  #
  # STILL HELD, NOT FITTED, AND THAT IS DELIBERATE -- do not "improve" this by
  # freeing it without changing the model form first. Measured 2026-08-25 on
  # the anchored, phase-corrected fit: freeing ocean_ppt with no anchor drives
  # it to **20.78 ppt** with a healthy-looking 1-sigma of 0.25 and condition
  # 23.5, while 367 real observations (2.9%) EXCEED that value and one reads
  # 43.5 ppt. The model is falsified (see the block above), so a freed
  # parameter absorbs the misfit, and ocean_ppt is simply where that shows up
  # most visibly because we know what seawater is.
  # Anchoring it on North Inlet does not rescue freeing it either: weighting
  # the anchor by its HONEST independent information -- 389 daily means carry a
  # lag-1 autocorrelation of 0.903, so n_eff is about 20 -- still yields
  # 22.25 ppt. Only overweighting the anchor by roughly 1,000x its information
  # content produces a marine answer, which is choosing the result and then
  # picking a weight that delivers it.
  # Cost of this change to the fit: rmse 4.3542 -> 4.3866 ppt. It gets slightly
  # WORSE, which is the honest direction -- an arbitrary value the falsified
  # model happened to prefer is replaced by a measured one.
  ocean_ppt: 35.5
  # Rough guess at the intrusion length at median flow, pending Task 5.
  l0_km: 18.0
  # Matches this fishery's own discharge distribution: close to the 3866 cfs
  # composite median measured above (365-day USGS daily means), not the raw
  # bucket median.
  q0_cfs: 4000.0
  # Savenije-family scaling exponent, L ~ Q^-k. 1/3 is the textbook starting
  # value; Task 5 fits the real one.
  k: 0.33
  # Tidal excursion: u_tidal * T / pi with u ~ 0.5 m/s and T = anuga.cycle_h
  # = 12.42 h gives 0.5 * 44712 / pi / 1000 = 7.12 km, rounded to 7.0.
  excursion_km: 7.0
  # Added 2026-08-22, addressing a review finding: a single length scale
  # (l0_km alone) forces one parameter to hold BOTH the mouth near ocean
  # salinity AND the head near fresh, and on this fishery's real 31.57 km
  # domain those two pull in opposite directions hard enough that satisfying
  # the head cost North Jetty 8.5 of its 34 ppt. front_width_km decouples the
  # front's sharpness from its position (l0_km).
  #
  # Redefined 2026-08-25: this is now the front's width AT q0_cfs, not
  # everywhere. Away from that reference it scales as (Q/q0)^-k -- the SAME
  # exponent l0_km's L(Q) uses (`_discharge_scale` in engine/salinity.py),
  # because a constant width could not be sharp at high flow and broad at
  # low flow at once: L(Q) itself ranges 37.14->1.13 km across the observed
  # 257x discharge span while this value did not move. MEASURED (gate
  # report, 2026-08-25, one recipe on one 12,204-row population): the mean
  # residual at FIXED distance (so it can't be confounded with position) ran
  # -0.9001->-3.3387 ppt at x=16.68 km and +1.8385->-1.7403 ppt at x=19.03 km
  # across flow quintiles. (An earlier draft cited -1.33->-3.72 and
  # +1.33->-2.03 here; those were PRE-REGISTRATIONS on a different,
  # unreproducible population, superseded by the figures above.) Scaling the
  # width the same way cuts that trend spread from 3.0087 to 0.3070 ppt --
  # an 89.8% reduction, and the single largest systematic improvement this
  # model has had.
  #
  # The 3.0087 -> 0.3070 trend-spread figures immediately above are ALSO
  # MEASURED (gate report, 2026-08-25: per-station flow quintiles at x=16.68
  # and x=19.03 km, trend = highest-quintile mean minus lowest-quintile mean,
  # spread = mean of the two absolute trends, both forms scored through one
  # code path on the same 12,204-row population). An earlier draft of this
  # comment claimed "2.96 to 0.55", which were PRE-REGISTRATIONS computed by
  # a method that could not be reproduced -- the spec's own quintile table
  # averages 2.875, not 2.96 -- on a different population of 11,688 rows.
  # Direction and rough size held; the numbers did not.
  #
  # The same gate found this width change does essentially ALL of the
  # flattening on its own. Adding a discharge-memory window on top moves the
  # spread the wrong way (0.4229), while still cutting rmse 12.5%. Memory is
  # NOT enabled here -- see discharge_memory_days, which stays 0.0.
  #
  # 5.0 km itself is UNCHANGED and still sized the old way, not refitted:
  # swept 3-8 km against the real 587,325-cell distance field and picked the
  # value where neither the mouth nor the head saturates to bit-identical
  # output across the full calibration range below, while still keeping both
  # ends plausibly near their limit. It remains a theoretical starting point,
  # not a measurement -- fitted stays False -- pending Task 5's fit under
  # this new form.
  front_width_km: 5.0
  # Same min/max as discharge_buckets above (365-day USGS daily means, n=365):
  # min 1232 / max 22996 cfs. Outside this span, salinity_field flags
  # extrapolated=True rather than silently trusting the fit.
  calibration_range_cfs: [1232.0, 22996.0]
  # FALSE, and stated explicitly rather than left to the model default, so
  # nothing downstream can read these constants as calibrated. Every value in
  # this block is theoretical; see the CALIBRATION ATTEMPTED AND DECLINED
  # note at the top of the block for what was tried and why it was declined.
  # `tidescout salinity calibrate` sets this True only when a run raises no
  # warning at all about its own data -- which requires, at minimum, salinity
  # observations at three or more distinct along-estuary distances spanning
  # more than one front width. Winyah has one distance, so no run can set it
  # True until a mid-bay sensor exists.
  #
  # Distinct from salinity_field's `extrapolated`, which asks only whether a
  # DISCHARGE fell inside calibration_range_cfs. A caller checking only that
  # flag sees green on every cell in the bay.
  fitted: false
