slug: winyah-bay
name: Winyah Bay
timezone: America/New_York
bbox: [-79.45, 33.15, -79.05, 33.60]
center: [-79.25, 33.35]
orientation_deg: 135 # entrance faces southeast
stations:
  # South Island Ferry, Intracoastal Waterway (33.2517, -79.2683) -- in-bay,
  # preferred by name per NOAA CO-OPS mdapi tidepredictions live lookup.
  tide: ["8662549"]
  # Winyah Bay entrance (33.2072, -79.1845) -- nearest the jetties/bay mouth,
  # per NOAA CO-OPS mdapi currentpredictions live lookup.
  currents: ["ACT6531"]
  # Resolved 2026-08-13 from the station's own datums endpoint (station
  # 8662549 does publish NAVD88):
  #   curl -s https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8662549/datums.json
  #   MLLW 2.560 ft, NAVD88 4.730 ft (both station datum, feet)
  #   offset = (MLLW - NAVD88) * 0.3048 = (2.560 - 4.730) * 0.3048 = -0.661 m
  # Add this to CO-OPS MLLW predictions (ft*0.3048) to get NAVD88 metres, the
  # bathymetry datum.
  tide_datum_offset_m: -0.661
  water:
    # WACCAMAW RIVER NEAR PAWLEYS ISLAND, SC (33.5066, -79.1270) -- tidal
    # reach (site_tp_cd=ST-TS), live-reporting both params (temp 27.5-30.9
    # degC, salinity 0.0 ppth over the last 3 days).
    - kind: usgs
      station: "021108125"
      params: ["00010", "00480"]
    # WACCAMAW R NR HAGLEY LANDING NR PAWLEYS ISLAND, SC (33.4446, -79.1739)
    # -- tidal reach, live-reporting both params (temp 28.9-29.8 degC,
    # salinity 0.0-1.0 ppth).
    - kind: usgs
      station: "02110815"
      params: ["00010", "00480"]
    # SAMPIT RIVER BELOW US 17 NEAR GEORGETOWN, SC (33.3599, -79.2880) --
    # right at Georgetown; only 00010 (temp) reports live, no 00480 data
    # available for this site, so salinity omitted.
    - kind: usgs
      station: "02136371"
      params: ["00010"]
rivers:
  # PEE DEE RIVER AT PEEDEE, SC (34.2043, -79.5484). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 3830-6710 cfs.
  # (More-downstream "PEE DEE RIVER AT HWY 701 NR BUCKSPORT, SC" 02135200 is
  # classified site_tp_cd=ST but empirically tidal -- 7 negative/reversing
  # readings in the same window -- so excluded despite being closer to the
  # bay.)
  - name: Pee Dee
    usgs_site: "02131000"
    weight: 1.0
    # Injection point for the ANUGA inflow operator, lon/lat WGS84. Read off
    # model_domain.polygon_utm_km vertex 8 (664.0, 3700.0 -- "across the
    # delta", the middle of the three river-mouth vertices), converted via
    # rasterio.warp.transform EPSG:26917 -> EPSG:4326. The domain's northern
    # boundary only carries three distinct vertices for three rivers upstream
    # of where their channels actually separate, so this is a proxy entry
    # point, not the true river mouth -- assigned to the middle vertex
    # because the Pee Dee's channel runs centrally past Sandy Island.
    # Verified 2026-08-14 against the real 315,564-triangle mesh: 29 wet
    # centroids (elevation < 0) fall inside Inlet_operator's 150 m injection
    # box at this point, so the vertex itself needed no correction.
    inflow_lonlat: [-79.23598, 33.42685]
  # WACCAMAW RIVER NEAR LONGS, SC (33.9127, -78.7150). Confirmed non-tidal
  # via live 3-day IV discharge history: 0 negative readings, 29-56 cfs.
  # Originally found by widening the live USGS site search manually, because
  # discovery.py's USGS bbox padding was asymmetric (east pad only +0.1 deg)
  # and missed this site -- the Waccamaw bends NE past Conway toward Longs on
  # the NC line. That padding is now symmetric (+/-1.0 deg on all four
  # sides), so a plain `tidescout stations winyah-bay` re-run reproduces this
  # ID directly; live-reconfirmed in the table after the fix. The only other
  # in-bbox Waccamaw discharge site (Hagley Landing, 02110815) is tidal
  # (site_tp_cd=ST-TS) and has no live 00060 IV data, so it was rejected for
  # this role (it is instead recorded as a water sensor above).
  - name: Waccamaw
    usgs_site: "02110500"
    weight: 1.0
    # Vertex 7 (669.0, 3701.0) -- "into the river mouths", the easternmost of
    # the three -- matches the Waccamaw's real position east of Sandy Island;
    # this lon/lat also lands within ~0.06 deg of the live Hagley Landing
    # water-sensor station above (33.4446, -79.1739), which is on the
    # Waccamaw itself.
    # CORRECTED 2026-08-14: the literal vertex checked out to only 3 wet
    # centroids inside the 150 m injection box against the real mesh -- thin
    # enough that a small mesh change could empty it and silently drop this
    # river's inflow. Nudged ~214 m south-southwest along the same channel to
    # utm=(668800, 3700925), which carries 23 wet centroids in the same box
    # (verified against the real 315,564-triangle mesh) while staying just as
    # close to the Hagley Landing sensor coordinate.
    inflow_lonlat: [-79.18419, 33.43444]
  # BLACK RIVER AT KINGSTREE, SC (33.6623, -79.8361). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 35-46 cfs. The
  # more-downstream alternative "BLACK RIVER NEAR ANDREWS, SC" 02136030 is
  # also site_tp_cd=ST but returned no live 00060 IV data in the same query,
  # so it was rejected as unreliable for real-time use.
  - name: Black
    usgs_site: "02136000"
    weight: 1.0
    # Vertex 9 (658.0, 3696.0) -- "NW, west of Georgetown", the westernmost
    # of the three -- matches the Black River joining the Pee Dee well
    # upstream (near Kingstree) from the west/inland side before the
    # combined flow reaches the bay.
    # CORRECTED 2026-08-14: the literal vertex sits on dry marsh -- the
    # nearest wet mesh centroid was 2,706 m away, so Inlet_operator's 150 m
    # injection box found zero centroids at all and crashed
    # (AttributeError: 'Inlet' object has no attribute 'inlet_line').
    # Moved to the nearest well-covered point on the same west-side channel,
    # utm=(661500, 3695870), 3,502 m from the original vertex and ~4,837 m
    # from the Pee Dee injection point (no overlap): 79 wet centroids fall
    # inside the 150 m box there (verified against the real
    # 315,564-triangle mesh), better coverage than Pee Dee's own point. A
    # cluster further south near Georgetown's harbor had even denser
    # coverage but was rejected -- it is the Sampit's waterway, not a
    # plausible proxy for the Black/Pee Dee confluence this vertex
    # represents.
    inflow_lonlat: [-79.26360, 33.38999]
discharge_buckets:
  # Recalibrated 2026-08-13 from 365 days of USGS daily means (statCd 00003),
  # weighted composite of the three gauges below (all weight 1.0). n=365 days:
  # min 1232 / p25 2774 / median 3866 / p75 6292 / max 22996 cfs.
  # Per-gauge means: Pee Dee 3745 (02131000, 365d), Waccamaw 642 (02110500,
  # 365d), Black 397 (02136000, 363d) cfs -- the composite is ~78% Pee Dee,
  # which is why the old 6000/25000 pair (authored before the gauges were
  # chosen) put nearly every day in "low" (p75 of 6292 barely clears the old
  # low threshold, and 25000 is above the observed max).
  low_below_cfs: 2774
  high_above_cfs: 6292
climatology:
  water_temp_f_by_month:
    {1: 48, 2: 50, 3: 57, 4: 66, 5: 74, 6: 81, 7: 85, 8: 85, 9: 80, 10: 71, 11: 60, 12: 52}
  salinity_ppt_by_month:
    {1: 8, 2: 7, 3: 6, 4: 8, 5: 10, 6: 12, 7: 14, 8: 15, 9: 14, 10: 12, 11: 10, 12: 9}
bathymetry:
  epsg: 26917
  cell_m: 10.0
  land_elev_m: 1.5
  contour_depths_m: [-2.0, -5.0, -10.0, -15.0]
features: {} # all defaults; tune here during validation
jetties:
  # Approximate from memory of the chart — refine vertices against
  # imagery/ENC during the known-spots validation pass. Format: [lon, lat].
  - name: North Jetty
    coords: [[-79.1850, 33.2320], [-79.1630, 33.2160]]
  - name: South Jetty
    coords: [[-79.1910, 33.2220], [-79.1700, 33.2050]]
model_domain:
  # Authored, not inferred: the Atlantic reconnects to the bay through North
  # Inlet and the ICW, so no cut line or flood-fill separates them (a mouth
  # barrier returns "estuary 798.5 km2, ocean 0.0"). Clockwise, UTM 17N km.
  # Encloses 238 km2 of water and all jetty structure.
  # KNOWN IMPERFECTION: the east edge (vertices 3-5) still admits some open
  # Atlantic. Refine against the chart/ENC -- see Task 6 step 7.
  polygon_utm_km:
    - [660.5, 3673.0]  # SW, inshore of the south approach
    - [666.0, 3670.8]  # S of the entrance
    - [671.0, 3672.0]  # SE, ~2 km seaward of the jetty tips
    - [672.0, 3677.5]  # E, offshore abeam the entrance
    - [671.5, 3683.0]  # NE, hugging North Island's seaward shore
    - [672.5, 3691.0]  # N along the island
    - [671.5, 3696.0]  # top of North Island
    - [669.0, 3701.0]  # into the river mouths
    - [664.0, 3700.0]  # across the delta
    - [658.0, 3696.0]  # NW, west of Georgetown
    - [655.5, 3692.0]  # W, up the Sampit
    - [658.0, 3686.0]  # SW down the west shore
    - [659.0, 3678.0]  # S along the ICW
  wet_level_m: 1.5
anuga:
  base_edge_m: 60.0
  jetty_edge_m: 15.0
  # Measured 2026-08-13 from 30 days of live tide_events() at station
  # 8662549 (South Island Ferry): daily range = mean(highs) - mean(lows) per
  # day, then averaged across n=30 days.
  #   n=30 days  mean range 3.61 ft = 1.10 m
  #   min 0.90 m  max 1.38 m
  # Cross-check against RANGE_FACTORS (neap 0.72 / spring 1.28): observed
  # min/mean = 0.90/1.10 = 0.82 > 0.72, observed max/mean = 1.38/1.10 = 1.25
  # < 1.28 -- the configured factors bracket the observed 30-day range with
  # margin (10% on the neap side, ~2% on the spring side; the spring margin
  # is thin because 30 days is only ~2 spring-neap cycles and may not have
  # captured true syzygy, but no bracket violation was observed).
  mean_range_m: 1.10
