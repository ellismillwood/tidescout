slug: winyah-bay
name: Winyah Bay
timezone: America/New_York
bbox: [-79.45, 33.15, -79.05, 33.60]
center: [-79.25, 33.35]
orientation_deg: 135 # entrance faces southeast
stations:
  # South Island Ferry, Intracoastal Waterway (33.2517, -79.2683) -- in-bay,
  # preferred by name per NOAA CO-OPS mdapi tidepredictions live lookup.
  tide: ["8662549"]
  # Winyah Bay entrance (33.2072, -79.1845) -- nearest the jetties/bay mouth,
  # per NOAA CO-OPS mdapi currentpredictions live lookup.
  currents: ["ACT6531"]
  # Resolved 2026-08-13 from the station's own datums endpoint (station
  # 8662549 does publish NAVD88):
  #   curl -s https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8662549/datums.json
  #   MLLW 2.560 ft, NAVD88 4.730 ft (both station datum, feet)
  #   offset = (MLLW - NAVD88) * 0.3048 = (2.560 - 4.730) * 0.3048 = -0.661 m
  # Add this to CO-OPS MLLW predictions (ft*0.3048) to get NAVD88 metres, the
  # bathymetry datum.
  tide_datum_offset_m: -0.661
  water:
    # WACCAMAW RIVER NEAR PAWLEYS ISLAND, SC (33.5066, -79.1270) -- tidal
    # reach (site_tp_cd=ST-TS), live-reporting both params (temp 27.5-30.9
    # degC, salinity 0.0 ppth over the last 3 days).
    - kind: usgs
      station: "021108125"
      params: ["00010", "00480"]
    # WACCAMAW R NR HAGLEY LANDING NR PAWLEYS ISLAND, SC (33.4446, -79.1739)
    # -- tidal reach, live-reporting both params (temp 28.9-29.8 degC,
    # salinity 0.0-1.0 ppth).
    - kind: usgs
      station: "02110815"
      params: ["00010", "00480"]
    # SAMPIT RIVER BELOW US 17 NEAR GEORGETOWN, SC (33.3599, -79.2880) --
    # right at Georgetown; only 00010 (temp) reports live, no 00480 data
    # available for this site, so salinity omitted.
    - kind: usgs
      station: "02136371"
      params: ["00010"]
rivers:
  # WARNING (root cause of the 2026-08-14 library build failure -- 6 of 9
  # regimes died with "Too small timestep"): inflow_lonlat must sit well
  # inside the domain, in the channel, in water deeper than -2 m -- NEVER on
  # or near the model_domain.polygon_utm_km boundary. The Pee Dee point below
  # was literally on polygon vertex v8 (0.4 m from the reflective `wall`
  # boundary); injecting 42.8 m3/s there against a reflective wall had
  # nowhere for the energy to go and produced a 3-7 m/s cell cluster ~1,700 m
  # upstream against a domain median of 0.045 m/s. Black River's point, 2,050
  # m inside the domain, showed no anomaly and is the control case. Always
  # re-verify against the real mesh (wet-cell count inside the 150 m
  # Inlet_operator injection box) after any domain-polygon or mesh change.
  # PEE DEE RIVER AT PEEDEE, SC (34.2043, -79.5484). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 3830-6710 cfs.
  # (More-downstream "PEE DEE RIVER AT HWY 701 NR BUCKSPORT, SC" 02135200 is
  # classified site_tp_cd=ST but empirically tidal -- 7 negative/reversing
  # readings in the same window -- so excluded despite being closer to the
  # bay.)
  - name: Pee Dee
    usgs_site: "02131000"
    weight: 1.0
    # inflow_share added 2026-08-16. Derived from the same 365-day per-gauge
    # daily means that calibrated discharge_buckets: Pee Dee 3745, Waccamaw
    # 642, Black 397 cfs, total 4784 -> 0.783 / 0.134 / 0.083. Before this,
    # `weight: 1.0` on all three made river_inflow_m3s split the composite
    # into equal thirds, injecting 4x the Black's share and 42% of the Pee
    # Dee's. `weight` is deliberately left at 1.0: it means something else
    # (include this gauge in the composite sum) and is correct as it stands.
    inflow_share: 0.783
    # Moved 2476 m 2026-08-14. Was on domain polygon vertex v8 (0.4 m from the
    # reflective wall), which caused the corner-injection instability that
    # killed 6 of 9 regimes. Now 2422 m from the domain polygon vertex, bed
    # -2.22 m, 961 wet 10 m raster cells inside the 150 m inlet box.
    # CORRECTED 2026-08-14: distance to the actual mesh ring (the reflective
    # wall Inlet_operator's 150 m box sits against) is 730 m, not 2422 m --
    # that figure was distance to the authored domain polygon, a different
    # line. The wet-cell count Inlet_operator actually sees is the mesh
    # centroid count, not the raster-cell count: 86/86 centroids wet in the
    # inlet box (raster cells were a proxy, not what the solver samples).
    # This point is now 2.5 km from Waccamaw's (was 5.0 km) -- not yet
    # confirmed the two sit in separate channels rather than both below the
    # Black/Pee Dee confluence; if they don't, per-river weighting here is
    # decorative regardless of the weight field above.
    inflow_lonlat: [-79.22587, 33.40619]
  # WACCAMAW RIVER NEAR LONGS, SC (33.9127, -78.7150). Confirmed non-tidal
  # via live 3-day IV discharge history: 0 negative readings, 29-56 cfs.
  # Originally found by widening the live USGS site search manually, because
  # discovery.py's USGS bbox padding was asymmetric (east pad only +0.1 deg)
  # and missed this site -- the Waccamaw bends NE past Conway toward Longs on
  # the NC line. That padding is now symmetric (+/-1.0 deg on all four
  # sides), so a plain `tidescout stations winyah-bay` re-run reproduces this
  # ID directly; live-reconfirmed in the table after the fix. The only other
  # in-bbox Waccamaw discharge site (Hagley Landing, 02110815) is tidal
  # (site_tp_cd=ST-TS) and has no live 00060 IV data, so it was rejected for
  # this role (it is instead recorded as a water sensor above).
  - name: Waccamaw
    usgs_site: "02110500"
    weight: 1.0
    inflow_share: 0.134
    # Moved 2469 m 2026-08-14; was 35 m from the reflective wall. Now 1246 m
    # from the authored domain polygon, bed -2.10 m, 626 wet 10 m raster
    # cells in the inlet box.
    # CORRECTED 2026-08-14: distance to the actual mesh ring is 89 m, not
    # 1246 m -- 1246 m was distance to the domain polygon, a different line
    # from the mesh boundary the reflective wall physics actually sits on.
    # The wet-cell count Inlet_operator actually sees is the mesh centroid
    # count: 72 centroids in the inlet box, 58 of them wet (not 626 raster
    # cells, which is a coarser proxy). See the Pee Dee comment above for the
    # same correction and the outstanding 2.5 km separate-channel question.
    inflow_lonlat: [-79.20462, 33.42022]
  # BLACK RIVER AT KINGSTREE, SC (33.6623, -79.8361). Confirmed non-tidal via
  # live 3-day IV discharge history: 0 negative readings, 35-46 cfs. The
  # more-downstream alternative "BLACK RIVER NEAR ANDREWS, SC" 02136030 is
  # also site_tp_cd=ST but returned no live 00060 IV data in the same query,
  # so it was rejected as unreliable for real-time use.
  - name: Black
    usgs_site: "02136000"
    weight: 1.0
    inflow_share: 0.083
    # Vertex 9 (658.0, 3696.0) -- "NW, west of Georgetown", the westernmost
    # of the three -- matches the Black River joining the Pee Dee well
    # upstream (near Kingstree) from the west/inland side before the
    # combined flow reaches the bay.
    # CORRECTED 2026-08-14: the literal vertex sits on dry marsh -- the
    # nearest wet mesh centroid was 2,706 m away, so Inlet_operator's 150 m
    # injection box found zero centroids at all and crashed
    # (AttributeError: 'Inlet' object has no attribute 'inlet_line').
    # Moved to the nearest well-covered point on the same west-side channel,
    # utm=(661500, 3695870), 3,502 m from the original vertex and ~4,837 m
    # from the Pee Dee injection point (no overlap): 90/90 mesh centroids in
    # the 150 m box are wet (re-measured 2026-08-14, up from an earlier
    # 79-centroid count on a since-changed mesh), better coverage than Pee
    # Dee's own point (86/86 wet). A cluster further south near Georgetown's
    # harbor had even denser coverage but was rejected -- it is the Sampit's
    # waterway, not a plausible proxy for the Black/Pee Dee confluence this
    # vertex represents.
    inflow_lonlat: [-79.26360, 33.38999]
discharge_buckets:
  # Recalibrated 2026-08-13 from 365 days of USGS daily means (statCd 00003),
  # weighted composite of the three gauges below (all weight 1.0). n=365 days:
  # min 1232 / p25 2774 / median 3866 / p75 6292 / max 22996 cfs.
  # Per-gauge means: Pee Dee 3745 (02131000, 365d), Waccamaw 642 (02110500,
  # 365d), Black 397 (02136000, 363d) cfs -- the composite is ~78% Pee Dee,
  # which is why the old 6000/25000 pair (authored before the gauges were
  # chosen) put nearly every day in "low" (p75 of 6292 barely clears the old
  # low threshold, and 25000 is above the observed max).
  low_below_cfs: 2774
  high_above_cfs: 6292
salinity:
  # Task 3 (2026-08-22) defaults -- THEORETICAL, not fitted. Task 5 replaces
  # every value below against real 00480 salinity observations and records
  # the fit residual alongside. Kept here (rather than relying silently on
  # the model default) so the provenance of each number is visible in one
  # place, per this file's own convention.
  #
  # Open-ocean end-member off the SC coast; typical nearshore Atlantic
  # salinity runs ~34-36 ppt. Not measured at Winyah's mouth specifically --
  # Task 5's fit should check it against the wettest USGS 00480 readings.
  ocean_ppt: 34.0
  # Rough guess at the intrusion length at median flow, pending Task 5.
  l0_km: 18.0
  # Matches this fishery's own discharge distribution: close to the 3866 cfs
  # composite median measured above (365-day USGS daily means), not the raw
  # bucket median.
  q0_cfs: 4000.0
  # Savenije-family scaling exponent, L ~ Q^-k. 1/3 is the textbook starting
  # value; Task 5 fits the real one.
  k: 0.33
  # Tidal excursion: u_tidal * T / pi with u ~ 0.5 m/s and T = anuga.cycle_h
  # = 12.42 h gives 0.5 * 44712 / pi / 1000 = 7.12 km, rounded to 7.0.
  excursion_km: 7.0
  # Same min/max as discharge_buckets above (365-day USGS daily means, n=365):
  # min 1232 / max 22996 cfs. Outside this span, salinity_field flags
  # extrapolated=True rather than silently trusting the fit.
  calibration_range_cfs: [1232.0, 22996.0]
climatology:
  water_temp_f_by_month:
    {1: 48, 2: 50, 3: 57, 4: 66, 5: 74, 6: 81, 7: 85, 8: 85, 9: 80, 10: 71, 11: 60, 12: 52}
  salinity_ppt_by_month:
    {1: 8, 2: 7, 3: 6, 4: 8, 5: 10, 6: 12, 7: 14, 8: 15, 9: 14, 10: 12, 11: 10, 12: 9}
bathymetry:
  epsg: 26917
  cell_m: 10.0
  land_elev_m: 1.5
  contour_depths_m: [-2.0, -5.0, -10.0, -15.0]
features: {} # all defaults; tune here during validation
jetties:
  # Traced from CUDEM bathymetry 2026-08-14, replacing seeds that were
  # "approximate from memory of the chart" and ran diagonally across North
  # Island. Method: local-median high-pass (>0.55 m relief), top elevation
  # capped at +2 m to exclude barrier dunes, skeletonised, centreline traced
  # endpoint-to-endpoint, simplified to 20 m. Corroboration: the deep entrance
  # channel runs BETWEEN these two ridges, and Ellis's "North Jetty" known spot
  # sits on the inshore west end of the north trace. Owner-confirmed.
  # Regenerate: .superpowers/sdd/2026-08-13-03-anuga-flow-library/jetty_trace.py
  - name: North Jetty
    # Traced from CUDEM bathymetry, then extended inshore to the beach at the
    # owner's direction -- the ridge trace stops ~935 m short because the rock
    # silts over / drops under survey resolution near shore, but the structure
    # continues. Three vertices, and the middle one IS the bend: this jetty is
    # non-linear and must not be straightened.
    coords: [[-79.17641, 33.21032], [-79.16345, 33.20409], [-79.15102, 33.20373]]
  - name: South Jetty
    # ridge top +0.08 m NAVD88, traced length 1484 m, then extended inshore to
    # the beach at the owner's direction ("the jetties should connect all the
    # way back to the shore"). The traced ridge stopped 1700 m short of land;
    # measured nearest land (z > 0.9 m) from its west end lies due west at
    # bearing 270 deg, [-79.18368, 33.19077]. That shore point is prepended,
    # leaving the traced vertices untouched.
    coords: [[-79.18368, 33.19077], [-79.16545, 33.19050], [-79.15397, 33.19051], [-79.15152, 33.19012], [-79.14958, 33.19018]]
model_domain:
  # Authored, not inferred: the Atlantic reconnects to the bay through North
  # Inlet and the ICW, so no cut line or flood-fill separates them (a mouth
  # barrier returns "estuary 798.5 km2, ocean 0.0"). Clockwise, UTM 17N km.
  # Encloses 238 km2 of water and all jetty structure.
  # KNOWN IMPERFECTION: the east edge (vertices 3-5) still admits some open
  # Atlantic. Refine against the chart/ENC -- see Task 6 step 7.
  polygon_utm_km:
    - [660.5, 3673.0]  # SW, inshore of the south approach
    - [666.0, 3670.8]  # S of the entrance
    # East edge pushed out to 673.5 km 2026-08-14: with the corrected jetty
    # geometry, 28% of the north jetty and 36% of the south fell OUTSIDE the
    # old boundary, so the seaward tips -- where the strongest rips form, and
    # the structure the spec singles out as must-catch -- were not meshed at
    # all. 673.5 km gives 100% coverage of both jetties plus ~1 km of apron
    # beyond the tips, for +9.8% triangles; 674.0 and 675.0 cost more and
    # cover no more.
    - [673.5, 3672.0]  # SE, ~1 km seaward of the jetty tips
    - [673.5, 3677.5]  # E, offshore abeam the entrance
    - [671.5, 3683.0]  # NE, hugging North Island's seaward shore
    - [672.5, 3691.0]  # N along the island
    - [671.5, 3696.0]  # top of North Island
    - [669.0, 3701.0]  # into the river mouths
    - [664.0, 3700.0]  # across the delta
    - [658.0, 3696.0]  # NW, west of Georgetown
    - [655.5, 3692.0]  # W, up the Sampit
    - [658.0, 3686.0]  # SW down the west shore
    - [659.0, 3678.0]  # S along the ICW
  # Only these segments may carry the ocean tide. Authored because bed depth
  # alone cannot distinguish a seaward opening from a deep channel 40 km
  # inland -- inferring it drove the ocean tide into the Pee Dee head and
  # destroyed two library builds.
  #
  # MEASURED EFFECT (against the real 605-segment simplified ring, 2026-08-14).
  # Five ring segments are demoted ocean -> open, 5.09 km total:
  #   idx  midpoint (km)          bed     length  what it is
  #     7  (662.783, 3698.825)  -2.06 m    219 m  Pee Dee head -- THE FAILURE SITE
  #   105  (655.733, 3692.370)  -5.95 m    305 m  Sampit head
  #   182  (660.963, 3679.925)  -3.70 m    273 m  west-shore ICW crossing
  #   184  (660.938, 3679.400)  -2.01 m    684 m  west-shore ICW crossing
  #   214  (662.578, 3672.160)  -2.43 m  3,608 m  southern approach cut
  # Only 0.52 km of that is river head; the other 4.57 km is back-barrier ICW
  # and southern-approach water. Segment 214 is genuinely back-barrier: the ring
  # from 664.25 to 667.63 km is wall (barrier beach) and ocean resumes at
  # 667.633 km.
  # RETAINED: ring indices 264-268, an unbroken 27.59 km run down the Atlantic
  # face from (672.073, 3693.180) to (667.633, 3671.060) km, beds -2.38..-9.34 m
  # = 18.4% of the 150.16 km perimeter (was 21.8%).
  # TRAP: classification uses each segment's MIDPOINT, and simplify(25 m)
  # produces multi-km segments across open water. Segment 214 is 3.6 km long and
  # ~1 km of it already lies inside this polygon; nudging the SW edge ~700 m
  # flips all 3.6 km between full tidal forcing and zero-gradient in one step.
  # CORRECTED 2026-08-16 (carryover open item 3). The SW corner was
  # (663.0, 3671.5), which left ring segment 214 -- 3,608 m of genuinely open
  # back-barrier water on the southern approach -- outside the ocean polygon
  # and therefore tagged `open`, which maps to Reflective_boundary: a wall
  # across open water. Nudging the corner to (662.0, 3672.0) promotes exactly
  # that one segment (ocean 27.59 -> 31.20 km) and leaves the four river-head
  # and ICW `open` segments and all 595 `wall` segments untouched -- verified
  # against production classify_boundary before the change.
  #
  # MEASURED, full mean_med variant run 2026-08-16: STABLE (mass residual
  # 1.46e-14, 26/26 snapshots, 2.61 h wall) and NEGLIGIBLE -- pooled p99 speed
  # delta is 0.77% of p99 speed over 5.47M wet-centroid samples, and within
  # 150 m of the known spots the mean delta is 0.00018 (Mud Bay), 0.00059
  # (Georgetown) and 0.00026 m/s (North Jetty) against flows of 0.5-1 m/s.
  # The shipped library was therefore NOT rebuilt for this. It is correct for
  # the next rebuild to inherit, and it independently clears the boundary as
  # an explanation for Georgetown's ebb lean.
  ocean_boundary_utm_km:
    - [665.0, 3669.0]
    - [676.0, 3669.0]
    - [676.0, 3695.0]
    - [669.5, 3695.0]
    - [669.5, 3681.0]
    - [662.0, 3672.0]
  # Capped at real high water, not the old blanket 1.5 m: mean_range_m 1.10 *
  # spring factor 1.28 / 2 = 0.70 m max simulated stage, plus ~0.2 m margin.
  # Do NOT "helpfully" raise this back toward 1.5 m -- that meshes land that
  # can never get wet (measured during Task 9: 315,564 tri / 21.4% never-wet
  # at 1.5 m vs 257,651 tri / 4.2% never-wet at 0.9 m).
  wet_level_m: 0.9
anuga:
  base_edge_m: 60.0
  # Retuned 2026-08-14 (was radius 300.0 / edge 15.0). ANUGA's timestep is
  # global and CFL-limited by the smallest triangle anywhere, so edge length
  # is the strong cost lever and radius is the weak one. Measured relative
  # cost against the previous 300 m / 15 m setting: radius 300->50 m alone
  # gives only 0.88; edge 15->25 m gives 0.53; the chosen 150 m / 20 m gives
  # 0.67.
  # 20 m is chosen deliberately to match the planned AnugaConfig.library_cell_m
  # = 20.0 (Task 11). The flow library rasterises to a 20 m grid, so mesh
  # structure finer than that cannot survive into the output -- meshing at
  # 15 m paid CFL cost for detail the library discards.
  jetty_radius_m: 150.0
  jetty_edge_m: 20.0
  # Measured 2026-08-13 from 30 days of live tide_events() at station
  # 8662549 (South Island Ferry): daily range = mean(highs) - mean(lows) per
  # day, then averaged across n=30 days.
  #   n=30 days  mean range 3.61 ft = 1.10 m
  #   min 0.90 m  max 1.38 m
  # Cross-check against RANGE_FACTORS (neap 0.72 / spring 1.28): observed
  # min/mean = 0.90/1.10 = 0.82 > 0.72, observed max/mean = 1.38/1.10 = 1.25
  # < 1.28 -- the configured factors bracket the observed 30-day range with
  # margin (10% on the neap side, ~2% on the spring side; the spring margin
  # is thin because 30 days is only ~2 spring-neap cycles and may not have
  # captured true syzygy, but no bracket violation was observed).
  mean_range_m: 1.10
